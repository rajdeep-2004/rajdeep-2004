# Draws the contribution-graph snake shown in README.md.
# Runs daily and on demand; pushes the generated SVGs to the `output` branch.
name: contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#d9442b&color_dots=#1b1820,#4a2a24,#7a3626,#b8432a,#f2a93b
            dist/snake-light.svg?color_snake=#d9442b&color_dots=#ebedf0,#f6d2c4,#eea48a,#d9442b,#a3301b

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
