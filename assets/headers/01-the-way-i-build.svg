<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-label="The way I build">
  <title>The way I build</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0c11"/><stop offset="1" stop-color="#17141c"/></linearGradient>
    <linearGradient id="heat" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#d9442b"/><stop offset="1" stop-color="#f2a93b"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .fade { animation: rise 0.8s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .draw { stroke-dasharray: 1; animation: draw 1.4s cubic-bezier(.6,.05,.3,1) both; }
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect width="1200" height="112" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="112" rx="14" fill="url(#grid)"/>
  <g class="fade">
    <text x="32" y="38" class="mono" font-size="14" fill="#d9442b" letter-spacing="4">01 / PROCESS</text>
    <text x="30" y="80" class="sans" font-size="38" font-weight="800" fill="#efe6d8" letter-spacing="-0.5">The way I build</text>
  </g>
  <path d="M32 98H1168" stroke="#2a2230" stroke-width="2"/>
  <path class="draw" pathLength="1" d="M32 98H1168" stroke="url(#heat)" stroke-width="2.5" stroke-linecap="round"/>
  <circle r="4.5" cy="98" fill="#f2a93b">
    <animate attributeName="cx" values="32;1168;1168" keyTimes="0;0.35;1" dur="7s" begin="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.33;0.36;1" dur="7s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="1168" y="80" text-anchor="end" class="sans" font-size="56" font-weight="800" fill="#efe6d8" fill-opacity="0.06">01</text>
</svg>
