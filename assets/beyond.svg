<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="1,000+ students upskilled, 8 hackathons run, 2x product case finalist, 240% LinkedIn growth">
  <title>1,000+ students upskilled, 8 hackathons run, 2x product case finalist, 240% LinkedIn growth</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0c11"/><stop offset="1" stop-color="#17141c"/></linearGradient>
    <linearGradient id="heat" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#d9442b"/><stop offset="1" stop-color="#f2a93b"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .fade { animation: rise 0.8s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .draw { stroke-dasharray: 1; animation: draw 1.4s cubic-bezier(.6,.05,.3,1) both; }
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g class="fade" style="animation-delay:0.0s">
    <rect x="0.75" y="0.75" width="283.5" height="198.5" rx="16" fill="url(#bg)" stroke="#d9442b" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="26" y="28" width="36" height="4" rx="2" fill="#d9442b"/>
    <text x="24" y="98" class="sans" font-size="54" font-weight="800" fill="#d9442b" letter-spacing="-1">1,000+</text>
    <text x="26" y="138" class="sans" font-size="21" font-weight="700" fill="#efe6d8">students upskilled</text>
    <text x="26" y="166" class="sans" font-size="16" fill="#8f8799">through 20+ bootcamps</text>
  </g>
  <g class="fade" style="animation-delay:0.2s">
    <rect x="305.75" y="0.75" width="283.5" height="198.5" rx="16" fill="url(#bg)" stroke="#f2a93b" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="331" y="28" width="36" height="4" rx="2" fill="#f2a93b"/>
    <text x="329" y="98" class="sans" font-size="54" font-weight="800" fill="#f2a93b" letter-spacing="-1">8</text>
    <text x="331" y="138" class="sans" font-size="21" font-weight="700" fill="#efe6d8">hackathons run</text>
    <text x="331" y="166" class="sans" font-size="16" fill="#8f8799">400 to 600+ sign-ups each</text>
  </g>
  <g class="fade" style="animation-delay:0.4s">
    <rect x="610.75" y="0.75" width="283.5" height="198.5" rx="16" fill="url(#bg)" stroke="#c9b8ff" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="636" y="28" width="36" height="4" rx="2" fill="#c9b8ff"/>
    <text x="634" y="98" class="sans" font-size="54" font-weight="800" fill="#c9b8ff" letter-spacing="-1">2×</text>
    <text x="636" y="138" class="sans" font-size="21" font-weight="700" fill="#efe6d8">product case finalist</text>
    <text x="636" y="166" class="sans" font-size="16" fill="#8f8799">BITS Pilani · Masters' Union</text>
  </g>
  <g class="fade" style="animation-delay:0.6s">
    <rect x="915.75" y="0.75" width="283.5" height="198.5" rx="16" fill="url(#bg)" stroke="#a8c686" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="941" y="28" width="36" height="4" rx="2" fill="#a8c686"/>
    <text x="939" y="98" class="sans" font-size="54" font-weight="800" fill="#a8c686" letter-spacing="-1">240%</text>
    <text x="941" y="138" class="sans" font-size="21" font-weight="700" fill="#efe6d8">LinkedIn growth</text>
    <text x="941" y="166" class="sans" font-size="16" fill="#8f8799">25 product teardowns</text>
  </g>
</svg>
