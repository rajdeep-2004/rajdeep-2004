<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Rajdeep Sanyal, product builder</title>
  <desc id="d">I find the user problem, write the spec, and ship the product. A dot loops from problem to spec to shipped.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#151a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a5b"/>
      <stop offset="1" stop-color="#ffc857"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a5b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff8a5b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .fade { animation: in 0.8s ease-out both; }
      .f1 { animation-delay: 0.1s; } .f2 { animation-delay: 0.5s; } .f3 { animation-delay: 0.9s; } .f4 { animation-delay: 1.3s; }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .node { animation: pulse 6s ease-in-out infinite; }
      .n2 { animation-delay: 2s; } .n3 { animation-delay: 4s; }
      @keyframes pulse { 0%, 100% { stroke-opacity: 0.25; } 10% { stroke-opacity: 1; } 30% { stroke-opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) { .fade, .caret, .node { animation: none; opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="20" fill="url(#grid)"/>
  <circle cx="930" cy="190" r="220" fill="url(#glow)"/>

  <!-- left: copy -->
  <g class="fade f1">
    <text x="64" y="86" class="mono" font-size="15" fill="#8b93b0" letter-spacing="1">~/rajdeep-2004 <tspan fill="#ffc857">$</tspan> whoami<tspan class="caret" fill="#ffc857"> ▍</tspan></text>
  </g>
  <g class="fade f2">
    <text x="62" y="158" class="sans" font-size="52" font-weight="800" fill="#f4f5fa">Rajdeep Sanyal</text>
  </g>
  <g class="fade f3">
    <text x="64" y="208" class="sans" font-size="26" font-weight="600" fill="url(#accent)">I find the user problem. Then I ship the fix.</text>
  </g>
  <g class="fade f4">
    <text x="64" y="256" class="sans" font-size="17" fill="#aab1c9">Product builder · CS &amp; AI undergrad · New Delhi</text>
    <text x="64" y="284" class="sans" font-size="17" fill="#aab1c9">Spec it, build it end to end, measure if it worked.</text>
    <rect x="64" y="312" width="214" height="34" rx="17" fill="#ff8a5b" fill-opacity="0.12" stroke="#ff8a5b" stroke-opacity="0.5"/>
    <text x="171" y="334" text-anchor="middle" class="mono" font-size="13" fill="#ffb38f">open to PM / AI PM roles</text>
  </g>

  <!-- right: the build loop -->
  <g transform="translate(930 190)">
    <path id="loop" d="M0 -110 A110 110 0 1 1 -0.01 -110" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="4 8"/>
    <circle r="7" fill="#ffc857">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
        <mpath href="#loop"/>
      </animateMotion>
    </circle>

    <g transform="translate(0 -110)">
      <rect class="node" x="-78" y="-22" width="156" height="44" rx="12" fill="#11162a" stroke="#ffc857" stroke-width="1.5"/>
      <text y="6" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#f4f5fa">① user problem</text>
    </g>
    <g transform="translate(95 55)">
      <rect class="node n2" x="-62" y="-22" width="124" height="44" rx="12" fill="#11162a" stroke="#ffc857" stroke-width="1.5"/>
      <text y="6" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#f4f5fa">② the spec</text>
    </g>
    <g transform="translate(-95 55)">
      <rect class="node n3" x="-62" y="-22" width="124" height="44" rx="12" fill="#11162a" stroke="#ffc857" stroke-width="1.5"/>
      <text y="6" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#f4f5fa">③ shipped</text>
    </g>
    <text y="6" text-anchor="middle" class="mono" font-size="13" fill="#8b93b0">repeat</text>
  </g>
</svg>
