<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="Loop: Campus chat shaped like the university really is.">
  <title>Loop: Campus chat shaped like the university really is.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0c11"/><stop offset="1" stop-color="#17141c"/></linearGradient>
    <linearGradient id="heat" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0"><stop offset="0" stop-color="#d9442b"/><stop offset="1" stop-color="#f2a93b"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6ea8ff" stop-opacity="0.22"/><stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/></radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .fade { animation: rise 0.8s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .draw { stroke-dasharray: 1; animation: draw 1.4s cubic-bezier(.6,.05,.3,1) both; }
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      .b1 { animation: rise 0.5s ease-out 0.2s both; } .b2 { animation: rise 0.5s ease-out 0.7s both; } .b3 { animation: rise 0.5s ease-out 1.2s both; }
      .dot { animation: bob 1.2s ease-in-out infinite; } .d2 { animation-delay: 0.15s; } .d3 { animation-delay: 0.3s; }
      @keyframes bob { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-5px); opacity: 1; } }
    </style>
  </defs>
  <rect width="600" height="260" rx="16" fill="url(#bg)"/>
  <rect width="600" height="260" rx="16" fill="url(#grid)"/>
  <circle cx="470" cy="130" r="150" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="598.5" height="258.5" rx="15.5" fill="none" stroke="#6ea8ff" stroke-opacity="0.35" stroke-width="1.5"/>
  <g transform="translate(470 125)">
    <g class="b1"><rect x="-110" y="-78" width="150" height="40" rx="14" fill="#141119" stroke="#6ea8ff" stroke-opacity="0.6"/>
      <rect x="-94" y="-62" width="96" height="8" rx="4" fill="#efe6d8" fill-opacity="0.6"/></g>
    <g class="b2"><rect x="-30" y="-24" width="140" height="40" rx="14" fill="#6ea8ff"/>
      <rect x="-14" y="-8" width="90" height="8" rx="4" fill="#0d0c11" fill-opacity="0.7"/></g>
    <g class="b3"><rect x="-110" y="30" width="78" height="36" rx="14" fill="#141119" stroke="#6ea8ff" stroke-opacity="0.6"/>
      <circle class="dot" cx="-88" cy="48" r="4" fill="#efe6d8"/><circle class="dot d2" cx="-71" cy="48" r="4" fill="#efe6d8"/><circle class="dot d3" cx="-54" cy="48" r="4" fill="#efe6d8"/></g>
    <text x="108" y="38" text-anchor="end" class="mono" font-size="11" fill="#6ea8ff">✓✓ read</text>
  </g>
  <g class="fade">
    <text x="32" y="50" class="mono" font-size="14" fill="#6ea8ff" letter-spacing="3">MOBILE · REALTIME · BUILDING</text>
    <text x="30" y="118" class="sans" font-size="54" font-weight="800" fill="#efe6d8" letter-spacing="-1">Loop</text>
  </g>
  <g class="fade" style="animation-delay:0.3s">
    <text x="32" y="162" class="sans" font-size="20" fill="#b4adbd">Campus chat shaped like the</text>
    <text x="32" y="190" class="sans" font-size="20" fill="#b4adbd">university really is.</text>
  </g>
  <rect x="32" y="214" width="56" height="4" rx="2" fill="#6ea8ff"/>
</svg>
