<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="Proctra: Timed exams on macOS. Fair, without being creepy.">
  <title>Proctra: Timed exams on macOS. Fair, without being creepy.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0c11"/><stop offset="1" stop-color="#17141c"/></linearGradient>
    <linearGradient id="heat" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0"><stop offset="0" stop-color="#d9442b"/><stop offset="1" stop-color="#f2a93b"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#d9442b" stop-opacity="0.22"/><stop offset="1" stop-color="#d9442b" stop-opacity="0"/></radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .fade { animation: rise 0.8s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .draw { stroke-dasharray: 1; animation: draw 1.4s cubic-bezier(.6,.05,.3,1) both; }
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      .ring { animation: count 8s linear infinite; }
      @keyframes count { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 1; } }
      .tick { transform-origin: 0 0; animation: spin 8s linear infinite; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    </style>
  </defs>
  <rect width="600" height="260" rx="16" fill="url(#bg)"/>
  <rect width="600" height="260" rx="16" fill="url(#grid)"/>
  <circle cx="470" cy="130" r="150" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="598.5" height="258.5" rx="15.5" fill="none" stroke="#d9442b" stroke-opacity="0.35" stroke-width="1.5"/>
  <g transform="translate(475 125)">
    <circle r="72" fill="#141119" stroke="#2a2230" stroke-width="10"/>
    <circle class="ring" r="72" fill="none" stroke="#d9442b" stroke-width="10" stroke-linecap="round" pathLength="1" stroke-dasharray="1" transform="rotate(-90)"/>
    <text y="4" text-anchor="middle" class="mono" font-size="30" font-weight="700" fill="#efe6d8">29:59</text>
    <text y="30" text-anchor="middle" class="mono" font-size="11" fill="#8f8799" letter-spacing="3">AUTOSAVED</text>
    <circle class="tick" cx="0" cy="-72" r="6" fill="#f2a93b"/>
  </g>
  <g class="fade">
    <text x="32" y="50" class="mono" font-size="14" fill="#d9442b" letter-spacing="3">DESKTOP · EXAMS</text>
    <text x="30" y="118" class="sans" font-size="54" font-weight="800" fill="#efe6d8" letter-spacing="-1">Proctra</text>
  </g>
  <g class="fade" style="animation-delay:0.3s">
    <text x="32" y="162" class="sans" font-size="20" fill="#b4adbd">Timed exams on macOS. Fair,</text>
    <text x="32" y="190" class="sans" font-size="20" fill="#b4adbd">without being creepy.</text>
  </g>
  <rect x="32" y="214" width="56" height="4" rx="2" fill="#d9442b"/>
</svg>
