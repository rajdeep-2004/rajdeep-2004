<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="Luna: A pocket dojo for engineers. Five-minute fights with real code.">
  <title>Luna: A pocket dojo for engineers. Five-minute fights with real code.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0c11"/><stop offset="1" stop-color="#17141c"/></linearGradient>
    <linearGradient id="heat" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0"><stop offset="0" stop-color="#d9442b"/><stop offset="1" stop-color="#f2a93b"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#c9b8ff" stop-opacity="0.22"/><stop offset="1" stop-color="#c9b8ff" stop-opacity="0"/></radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .fade { animation: rise 0.8s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .draw { stroke-dasharray: 1; animation: draw 1.4s cubic-bezier(.6,.05,.3,1) both; }
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      .tw { animation: tw 2.8s ease-in-out infinite; }
      @keyframes tw { 50% { opacity: 0.15; } }
      .slash { stroke-dasharray: 1; animation: slash 4s cubic-bezier(.7,0,.2,1) infinite; }
      @keyframes slash { 0% { stroke-dashoffset: 1; opacity: 1; } 18% { stroke-dashoffset: 0; opacity: 1; } 40%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    </style>
  </defs>
  <rect width="600" height="260" rx="16" fill="url(#bg)"/>
  <rect width="600" height="260" rx="16" fill="url(#grid)"/>
  <circle cx="470" cy="130" r="150" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="598.5" height="258.5" rx="15.5" fill="none" stroke="#c9b8ff" stroke-opacity="0.35" stroke-width="1.5"/>
  <g><circle class="tw" style="animation-delay:-0.0s" cx="380" cy="50" r="1.8" fill="#efe6d8"/><circle class="tw" style="animation-delay:-0.7s" cx="420" cy="210" r="1.4" fill="#efe6d8"/><circle class="tw" style="animation-delay:-1.4s" cx="560" cy="60" r="2" fill="#efe6d8"/><circle class="tw" style="animation-delay:-2.1s" cx="545" cy="205" r="1.5" fill="#efe6d8"/><circle class="tw" style="animation-delay:-2.8s" cx="360" cy="140" r="1.3" fill="#efe6d8"/><circle class="tw" style="animation-delay:-3.5s" cx="520" cy="30" r="1.2" fill="#efe6d8"/></g>
  <g transform="translate(470 125)">
    <mask id="cres"><circle r="66" fill="#fff"/><circle cx="26" cy="-16" r="60" fill="#000"/></mask>
    <circle r="66" fill="#efe6d8" mask="url(#cres)"/>
    <path class="slash" pathLength="1" d="M-110 70L110 -80" stroke="#d9442b" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g class="fade">
    <text x="32" y="50" class="mono" font-size="14" fill="#c9b8ff" letter-spacing="3">MOBILE · GAME</text>
    <text x="30" y="118" class="sans" font-size="54" font-weight="800" fill="#efe6d8" letter-spacing="-1">Luna</text>
  </g>
  <g class="fade" style="animation-delay:0.3s">
    <text x="32" y="162" class="sans" font-size="20" fill="#b4adbd">A pocket dojo for engineers.</text>
    <text x="32" y="190" class="sans" font-size="20" fill="#b4adbd">Five-minute fights with real code.</text>
  </g>
  <rect x="32" y="214" width="56" height="4" rx="2" fill="#c9b8ff"/>
</svg>
