<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="Strata: Ask any repo a question. Answers cited to the line.">
  <title>Strata: Ask any repo a question. Answers cited to the line.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0c11"/><stop offset="1" stop-color="#17141c"/></linearGradient>
    <linearGradient id="heat" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0"><stop offset="0" stop-color="#d9442b"/><stop offset="1" stop-color="#f2a93b"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f2a93b" stop-opacity="0.22"/><stop offset="1" stop-color="#f2a93b" stop-opacity="0"/></radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .fade { animation: rise 0.8s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .draw { stroke-dasharray: 1; animation: draw 1.4s cubic-bezier(.6,.05,.3,1) both; }
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      .lay { animation: float 4s ease-in-out infinite; }
      .l2 { animation-delay: -1.3s; } .l3 { animation-delay: -2.6s; }
      @keyframes float { 50% { transform: translateY(-4px); } }
      .scan { animation: scan 3.2s ease-in-out infinite; }
      @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.85; } 85% { opacity: 0.85; } 100% { transform: translateY(140px); opacity: 0; } }
      .chip { animation: rise 0.6s ease-out 1s both; }
    </style>
  </defs>
  <rect width="600" height="260" rx="16" fill="url(#bg)"/>
  <rect width="600" height="260" rx="16" fill="url(#grid)"/>
  <circle cx="470" cy="130" r="150" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="598.5" height="258.5" rx="15.5" fill="none" stroke="#f2a93b" stroke-opacity="0.35" stroke-width="1.5"/>
  <g transform="translate(470 120)">
    <g fill="#141119" stroke="#f2a93b" stroke-width="1.6">
      <path class="lay l3" d="M-90 40L0 0 90 40 0 80Z" stroke-opacity="0.4"/>
      <path class="lay l2" d="M-90 10L0 -30 90 10 0 50Z" stroke-opacity="0.65"/>
      <path class="lay l1" d="M-90 -20L0 -60 90 -20 0 20Z"/>
    </g>
    <path d="M-40 -22h50M-30 -12h44M-48 -32h30" stroke="#efe6d8" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round" transform="skewY(0)"/>
    <rect class="scan" x="-95" y="-62" width="190" height="3" fill="#f2a93b" opacity="0.8"/>
  </g>
  <g transform="translate(392 222)"><g class="chip">
    <rect width="168" height="26" rx="13" fill="#f2a93b" fill-opacity="0.12" stroke="#f2a93b" stroke-opacity="0.6"/>
    <text x="84" y="17.5" text-anchor="middle" class="mono" font-size="12" fill="#f2a93b">src/lib/rag.ts:42</text>
  </g></g>
  <g class="fade">
    <text x="32" y="50" class="mono" font-size="14" fill="#f2a93b" letter-spacing="3">AI · RAG</text>
    <text x="30" y="118" class="sans" font-size="54" font-weight="800" fill="#efe6d8" letter-spacing="-1">Strata</text>
  </g>
  <g class="fade" style="animation-delay:0.3s">
    <text x="32" y="162" class="sans" font-size="20" fill="#b4adbd">Ask any repo a question.</text>
    <text x="32" y="190" class="sans" font-size="20" fill="#b4adbd">Answers cited to the line.</text>
  </g>
  <rect x="32" y="214" width="56" height="4" rx="2" fill="#f2a93b"/>
</svg>
